<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brave Browser</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #202124;
}

.browser {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.toolbar {
    height: 58px;
    min-height: 58px;
    background: #252525;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px;
    box-sizing: border-box;
}

button {
    border: 0;
    background: transparent;
    color: white;
    width: 38px;
    height: 38px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #3a3a3a;
}

.logo {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    background: #fb542b;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.address {
    flex: 1;
    height: 40px;
    border-radius: 22px;
    border: 1px solid #444;
    background: #333;
    color: white;
    outline: none;
    padding: 0 16px;
    font-size: 15px;
}

.go {
    background: #fb542b;
    width: 48px;
    border-radius: 20px;
}

#page {
    flex: 1;
    width: 100%;
    border: 0;
    background: white;
}
</style>

</head>

<body>

<div class="browser">

```
<div class="toolbar">

    <div class="logo">B</div>

    <button id="back" title="Back">←</button>
    <button id="forward" title="Forward">→</button>
    <button id="reload" title="Reload">↻</button>
    <button id="home" title="Home">⌂</button>

    <input
        id="address"
        class="address"
        type="text"
        placeholder="Search or enter address"
        autocomplete="off"
    >

    <button id="goButton" class="go">Go</button>

</div>

<iframe
    id="page"
    src="https://example.com"
    title="Web page">
</iframe>
```

</div>

<script>
(function () {

    const address = document.getElementById("address");
    const page = document.getElementById("page");
    const goButton = document.getElementById("goButton");
    const backButton = document.getElementById("back");
    const forwardButton = document.getElementById("forward");
    const reloadButton = document.getElementById("reload");
    const homeButton = document.getElementById("home");

    let history = ["https://example.com"];
    let historyIndex = 0;


    function looksLikeWebsite(text) {

        if (text.startsWith("http://")) return true;
        if (text.startsWith("https://")) return true;
        if (text.startsWith("www.")) return true;

        /*
         * A domain such as wikipedia.org is a website.
         * Words such as cats are NOT websites.
         */
        if (
            text.includes(".") &&
            !text.includes(" ")
        ) {
            return true;
        }

        return false;
    }


    function openWebsite(url, saveHistory) {

        if (saveHistory) {

            history = history.slice(0, historyIndex + 1);
            history.push(url);
            historyIndex++;
        }

        page.src = url;
        address.value = url;
    }


    function search(text) {

        /*
         * NO GOOGLE.
         *
         * Searches use Brave Search.
         *
         * Brave Search is opened in a new browser tab
         * because search engines can refuse iframe embedding.
         */

        const url =
            "https://search.brave.com/search?q=" +
            encodeURIComponent(text);

        window.open(url, "_blank");
    }


    function navigate() {

        const text = address.value.trim();

        if (text === "") {
            return;
        }


        /*
         * If it is a normal word or phrase:
         *
         * cats
         * funny cats
         * minecraft
         *
         * -> Brave Search
         */

        if (!looksLikeWebsite(text)) {
            search(text);
            return;
        }


        /*
         * Otherwise it is a website.
         */

        let url = text;

        if (
            !url.startsWith("http://") &&
            !url.startsWith("https://")
        ) {
            url = "https://" + url;
        }

        openWebsite(url, true);
    }


    goButton.addEventListener("click", navigate);


    address.addEventListener("keydown", function (event) {

        if (event.key === "Enter") {
            event.preventDefault();
            navigate();
        }

    });


    backButton.addEventListener("click", function () {

        if (historyIndex > 0) {

            historyIndex--;

            const url = history[historyIndex];

            page.src = url;
            address.value = url;
        }

    });


    forwardButton.addEventListener("click", function () {

        if (historyIndex < history.length - 1) {

            historyIndex++;

            const url = history[historyIndex];

            page.src = url;
            address.value = url;
        }

    });


    reloadButton.addEventListener("click", function () {
        page.src = page.src;
    });


    homeButton.addEventListener("click", function () {

        history = ["https://example.com"];
        historyIndex = 0;

        page.src = "https://example.com";
        address.value = "";
    });


})();
</script>

</body>
</html>
