<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brave Browser</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #202124;
}

.browser {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 58px;
    background: #252525;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
}

button {
    border: 0;
    background: transparent;
    color: white;
    width: 38px;
    height: 38px;
    font-size: 19px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #3a3a3a;
}

.logo {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #fb542b;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.address {
    flex: 1;
    height: 40px;
    border-radius: 22px;
    border: 1px solid #444;
    background: #333;
    color: white;
    outline: none;
    padding: 0 16px;
    font-size: 15px;
}

.go {
    background: #fb542b;
    border-radius: 20px;
}

iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: white;
}
</style>

</head>

<body>

<div class="browser">

```
<div class="topbar">

    <div class="logo">B</div>

    <button onclick="goBack()" title="Back">←</button>
    <button onclick="goForward()" title="Forward">→</button>
    <button onclick="reloadPage()" title="Reload">↻</button>
    <button onclick="goHome()" title="Home">⌂</button>

    <input
        id="address"
        class="address"
        type="text"
        placeholder="Search or enter address"
        autocomplete="off"
    >

    <button class="go" onclick="go()">Go</button>

</div>

<iframe
    id="page"
    src="https://example.com">
</iframe>
```

</div>

<script>

const address = document.getElementById("address");
const page = document.getElementById("page");

let pages = ["https://example.com"];
let position = 0;


// Detect whether the text is a website
function isWebsite(text) {

    return (
        text.startsWith("http://") ||
        text.startsWith("https://") ||
        text.startsWith("www.") ||
        (
            text.includes(".") &&
            !text.includes(" ")
        )
    );
}


// Go / Search
function go() {

    const text = address.value.trim();

    if (!text) {
        return;
    }


    // SEARCH
    // Anything that isn't a website goes to Brave Search.
    if (!isWebsite(text)) {

        const searchURL =
            "https://search.brave.com/search?q=" +
            encodeURIComponent(text);

        window.open(searchURL, "_blank");

        return;
    }


    // WEBSITE
    let url = text;

    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {
        url = "https://" + url;
    }

    page.src = url;
    address.value = url;

    pages = pages.slice(0, position + 1);
    pages.push(url);
    position++;
}


// Enter key
address.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        go();
    }

});


// Back
function goBack() {

    if (position > 0) {

        position--;

        page.src = pages[position];
        address.value = pages[position];
    }
}


// Forward
function goForward() {

    if (position < pages.length - 1) {

        position++;

        page.src = pages[position];
        address.value = pages[position];
    }
}


// Reload
function reloadPage() {
    page.src = page.src;
}


// Home
function goHome() {

    pages = ["https://example.com"];
    position = 0;

    page.src = "https://example.com";
    address.value = "";
}

</script>

</body>
</html>
