```
<div id="toolbar">
    <button id="back">‹</button>
    <button id="forward">›</button>
    <button id="reload">↻</button>

    <input
        id="url"
        type="text"
        placeholder="Search or enter website"
        autocomplete="off"
        spellcheck="false"
    >

    <button id="go">Go</button>
</div>

<div id="frame-container">
    <iframe
        id="ifr"
        allow="autoplay; fullscreen; gamepad; microphone; camera"
    ></iframe>
</div>
```

</div>

<script>
const iframe = document.getElementById("ifr");
const urlInput = document.getElementById("url");

const goButton = document.getElementById("go");
const backButton = document.getElementById("back");
const forwardButton = document.getElementById("forward");
const reloadButton = document.getElementById("reload");

let pages = [];
let currentPage = -1;


/* Convert the user's input into a URL */
function getUrl(input) {

    input = input.trim();

    if (!input) {
        return null;
    }

    /*
     * If the user entered a URL,
     * open that URL.
     */
    if (
        input.startsWith("http://") ||
        input.startsWith("https://") ||
        input.startsWith("www.")
    ) {
        if (input.startsWith("www.")) {
            input = "https://" + input;
        }

        return input;
    }

    /*
     * If it looks like a domain,
     * open it directly.
     */
    if (
        input.includes(".") &&
        !input.includes(" ")
    ) {
        return "https://" + input;
    }

    /*
     * Otherwise perform a search.
     */
    return "https://www.google.com/search?q=" +
        encodeURIComponent(input);
}


/* Open a page */
function openPage(input, saveHistory = true) {

    const url = getUrl(input);

    if (!url) {
        return;
    }

    iframe.src = url;
    urlInput.value = input;

    if (saveHistory) {

        pages = pages.slice(0, currentPage + 1);

        pages.push({
            input: input,
            url: url
        });

        currentPage = pages.length - 1;
    }

    updateButtons();
}


/* Go button */
goButton.onclick = function () {
    openPage(urlInput.value);
};


/* Press Enter */
urlInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        openPage(urlInput.value);
    }

});


/* Back */
backButton.onclick = function () {

    if (currentPage > 0) {

        currentPage--;

        iframe.src = pages[currentPage].url;
        urlInput.value = pages[currentPage].input;

        updateButtons();
    }

};


/* Forward */
forwardButton.onclick = function () {

    if (currentPage < pages.length - 1) {

        currentPage++;

        iframe.src = pages[currentPage].url;
        urlInput.value = pages[currentPage].input;

        updateButtons();
    }

};


/* Reload */
reloadButton.onclick = function () {

    iframe.src = iframe.src;

};


/* Enable/disable navigation buttons */
function updateButtons() {

    backButton.disabled = currentPage <= 0;

    forwardButton.disabled =
        currentPage >= pages.length - 1;
}


/* Starting page */
openPage("https://example.com");

</script>

</body>
</html>
