<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brave Browser</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #202124;
}

.browser {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.toolbar {
    height: 58px;
    min-height: 58px;
    background: #252525;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px;
    box-sizing: border-box;
}

button {
    border: 0;
    background: transparent;
    color: white;
    width: 38px;
    height: 38px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #3a3a3a;
}

.logo {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    background: #fb542b;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.address {
    flex: 1;
    height: 40px;
    border-radius: 22px;
    border: 1px solid #444;
    background: #333;
    color: white;
    outline: none;
    padding: 0 16px;
    font-size: 15px;
}

.go {
    background: #fb542b;
    width: 48px;
    border-radius: 20px;
}

.page-area {
    flex: 1;
    width: 100%;
    position: relative;
    background: white;
}

#page {
    width: 100%;
    height: 100%;
    border: 0;
    background: white;
    display: block;
}

.blocked {
    position: absolute;
    inset: 0;
    background: white;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    color: #202124;
}

.blocked.show {
    display: flex;
}

.blocked h2 {
    margin: 0 0 8px 0;
    font-size: 20px;
}

.blocked p {
    margin: 0 0 20px 0;
    color: #666;
    max-width: 360px;
    font-size: 14px;
}

.blocked a {
    background: #fb542b;
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
}
</style>

</head>

<body>

<div class="browser">

    <div class="toolbar">

        <div class="logo">B</div>

        <button id="back" title="Back">←</button>
        <button id="forward" title="Forward">→</button>
        <button id="reload" title="Reload">↻</button>
        <button id="home" title="Home">⌂</button>

        <input
            id="address"
            class="address"
            type="text"
            placeholder="Search or enter address"
            autocomplete="off"
        >

        <button id="goButton" class="go">Go</button>

    </div>

    <div class="page-area">

        <iframe
            id="page"
            src="https://example.com"
            title="Web page"
            sandbox="allow-scripts allow-same-origin allow-forms">
        </iframe>

        <div id="blocked" class="blocked">
            <h2>This site refused to connect</h2>
            <p>Some websites block being shown inside another page (a security setting called X-Frame-Options).</p>
        </div>

    </div>

</div>

<script>
(function () {

    const address = document.getElementById("address");
    const page = document.getElementById("page");
    const goButton = document.getElementById("goButton");
    const backButton = document.getElementById("back");
    const forwardButton = document.getElementById("forward");
    const reloadButton = document.getElementById("reload");
    const homeButton = document.getElementById("home");
    const blocked = document.getElementById("blocked");

    let history = ["https://example.com"];
    let historyIndex = 0;

    let loadTimer = null;
    let loadedOnce = false;


    function looksLikeWebsite(text) {

        if (text.startsWith("http://")) return true;
        if (text.startsWith("https://")) return true;
        if (text.startsWith("www.")) return true;

        /*
         * A domain such as wikipedia.org is a website.
         * Words such as cats are NOT websites.
         */
        if (
            text.includes(".") &&
            !text.includes(" ")
        ) {
            return true;
        }

        return false;
    }


    function hideBlockedScreen() {
        blocked.classList.remove("show");
        page.style.visibility = "visible";
    }


    function showBlockedScreen() {
        blocked.classList.add("show");
        page.style.visibility = "hidden";
    }


    function watchForBlock(url) {

        loadedOnce = false;

        if (loadTimer) {
            clearTimeout(loadTimer);
        }

        hideBlockedScreen();

        /*
         * Iframes don't fire a normal error event when a site
         * refuses embedding (X-Frame-Options / CSP). Instead we
         * give it a few seconds: if the iframe's "load" event
         * hasn't actually fired with real content by then, we
         * assume the site refused and show the fallback screen.
         */
        loadTimer = setTimeout(function () {
            if (!loadedOnce) {
                showBlockedScreen();
            }
        }, 3500);
    }


    page.addEventListener("load", function () {

        loadedOnce = true;

        if (loadTimer) {
            clearTimeout(loadTimer);
        }

        /*
         * A cross-origin iframe that loaded successfully can't be
         * inspected (browser security), but if we get here without
         * the timeout firing, treat it as a successful connection.
         */
        try {
            // Accessing contentWindow.location on a same-origin frame
            // works fine; on cross-origin it throws, which is expected
            // and still means the page itself DID load in the iframe.
            void page.contentWindow.location.href;
        } catch (e) {
            // Cross-origin load succeeded — this is normal and fine.
        }

        hideBlockedScreen();
    });


    function openWebsite(url, saveHistory) {

        if (saveHistory) {

            history = history.slice(0, historyIndex + 1);
            history.push(url);
            historyIndex++;
        }

        page.src = url;
        address.value = url;

        watchForBlock(url);
    }


    function search(text) {

        /*
         * Brave Search blocks iframe embedding (X-Frame-Options),
         * like most search engines, so it can never load inside
         * Cine-OS no matter what we do here.
         *
         * DuckDuckGo's HTML endpoint does not block embedding, so
         * we use that instead to keep search results inside the
         * browser app.
         */

        const url =
            "https://html.duckduckgo.com/html/?q=" +
            encodeURIComponent(text);

        openWebsite(url, true);
    }


    function navigate() {

        const text = address.value.trim();

        if (text === "") {
            return;
        }


        /*
         * If it is a normal word or phrase:
         *
         * cats
         * funny cats
         * minecraft
         *
         * -> Brave Search
         */

        if (!looksLikeWebsite(text)) {
            search(text);
            return;
        }


        /*
         * Otherwise it is a website.
         */

        let url = text;

        if (
            !url.startsWith("http://") &&
            !url.startsWith("https://")
        ) {
            url = "https://" + url;
        }

        openWebsite(url, true);
    }


    goButton.addEventListener("click", navigate);


    address.addEventListener("keydown", function (event) {

        if (event.key === "Enter") {
            event.preventDefault();
            navigate();
        }

    });


    backButton.addEventListener("click", function () {

        if (historyIndex > 0) {

            historyIndex--;

            const url = history[historyIndex];

            page.src = url;
            address.value = url;

            watchForBlock(url);
        }

    });


    forwardButton.addEventListener("click", function () {

        if (historyIndex < history.length - 1) {

            historyIndex++;

            const url = history[historyIndex];

            page.src = url;
            address.value = url;

            watchForBlock(url);
        }

    });


    reloadButton.addEventListener("click", function () {
        watchForBlock(page.src);
        page.src = page.src;
    });


    homeButton.addEventListener("click", function () {

        history = ["https://example.com"];
        historyIndex = 0;

        page.src = "https://example.com";
        address.value = "";

        watchForBlock("https://example.com");
    });


})();
</script>

</body>
</html>
