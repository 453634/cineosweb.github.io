```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brave Browser</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #202124;
    }

    .browser {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .topbar {
        height: 58px;
        background: #252525;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        color: white;
    }

    button {
        border: none;
        background: transparent;
        color: white;
        font-size: 19px;
        width: 38px;
        height: 38px;
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover {
        background: #3a3a3a;
    }

    .brave-logo {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #fb542b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: white;
        font-size: 15px;
    }

    .address {
        flex: 1;
        height: 40px;
        border-radius: 22px;
        border: 1px solid #444;
        outline: none;
        padding: 0 16px;
        background: #333;
        color: white;
        font-size: 15px;
    }

    .address:focus {
        border-color: #777;
    }

    .go {
        background: #fb542b;
        border-radius: 20px;
        width: 48px;
        font-size: 16px;
    }

    .go:hover {
        background: #e94720;
    }

    iframe {
        flex: 1;
        width: 100%;
        border: none;
        background: white;
    }

    .home {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        background: #202124;
    }

    .home-logo {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: #fb542b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 45px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .home h1 {
        margin: 0 0 8px;
    }

    .home p {
        color: #aaa;
    }
</style>
</head>

<body>

<div class="browser">

    <div class="topbar">

        <div class="brave-logo">B</div>

        <button onclick="goBack()" title="Back">←</button>
        <button onclick="goForward()" title="Forward">→</button>
        <button onclick="reloadPage()" title="Reload">↻</button>
        <button onclick="goHome()" title="Home">⌂</button>

        <input
            id="address"
            class="address"
            type="text"
            placeholder="Search or enter address"
            autocomplete="off"
        >

        <button class="go" id="goButton">Go</button>

    </div>

    <iframe
        id="browserFrame"
        src="https://example.com"
        allowfullscreen>
    </iframe>

</div>

<script>
const address = document.getElementById("address");
const frame = document.getElementById("browserFrame");

let historyList = ["https://example.com"];
let historyIndex = 0;


// Decide whether the user entered a URL or a search
function getDestination(text) {

    text = text.trim();

    if (!text) {
        return null;
    }

    // Full URL
    if (text.startsWith("http://") || text.startsWith("https://")) {
        return text;
    }

    // www.example.com
    if (text.startsWith("www.")) {
        return "https://" + text;
    }

    // example.com
    if (
        text.includes(".") &&
        !text.includes(" ")
    ) {
        return "https://" + text;
    }

    // Search
    return "https://www.google.com/search?q=" +
           encodeURIComponent(text);
}


// Load a website
function loadSite(url, saveHistory = true) {

    if (!url) return;

    // Google searches cannot reliably be displayed inside
    // the iframe, so open them in a normal browser tab.
    if (
        url.startsWith("https://www.google.com/search") ||
        url.startsWith("https://google.com/search")
    ) {
        window.open(url, "_blank");
        return;
    }

    frame.src = url;
    address.value = url;

    if (saveHistory) {

        historyList =
            historyList.slice(0, historyIndex + 1);

        historyList.push(url);
        historyIndex++;
    }
}


// Go button
document.getElementById("goButton").onclick = function () {

    const text = address.value;
    const destination = getDestination(text);

    if (destination) {
        loadSite(destination);
    }
};


// Press Enter
address.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        const destination =
            getDestination(address.value);

        if (destination) {
            loadSite(destination);
        }
    }

});


// Back
function goBack() {

    if (historyIndex > 0) {

        historyIndex--;

        const url =
            historyList[historyIndex];

        frame.src = url;
        address.value = url;
    }
}


// Forward
function goForward() {

    if (historyIndex < historyList.length - 1) {

        historyIndex++;

        const url =
            historyList[historyIndex];

        frame.src = url;
        address.value = url;
    }
}


// Reload
function reloadPage() {
    frame.src = frame.src;
}


// Home
function goHome() {

    historyIndex = 0;
    historyList = ["https://example.com"];

    frame.src = "https://example.com";
    address.value = "";
}
</script>

</body>
</html>
